# ~/.tmux.conf
# Managed by chezmoi.

# Remap the prefix from Ctrl-b to Ctrl-a.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Keep Neovim color, focus, and key handling predictable inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
setw -g xterm-keys on
set -g focus-events on
set -sg escape-time 10
set -g set-clipboard on

# Session ergonomics.
set -g mouse on
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g window-status-current-style "fg=colour81,bold"
# Drop the default status-right (it shows the pane title, which programs like
# Claude Code overwrite with noise) in favor of a simple clock.
set -g status-right '%H:%M %d-%b'

# Titles: always "<directory basename> (<foreground command>)", ignoring
# whatever title programs try to set via escape sequences. Claude Code reports
# its process name as a bare version string (e.g. "2.1.174") and codex as its
# arch-suffixed binary name (e.g. "codex-aarch64-a"), so normalize both.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path} (#{s/^[0-9]+(\.[0-9]+)+$/claude/;s/^codex-.*$/codex/:pane_current_command})'
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#{b:pane_current_path} (#{s/^[0-9]+(\.[0-9]+)+$/claude/;s/^codex-.*$/codex/:pane_current_command})'

# Keep new tmux windows and panes in the current project directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Nudge the current window left or right in the window list. -r makes the
# binding repeatable so you can press the prefix once and then < or > repeatedly.
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

# Fast pane movement without the tmux prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Pane movement that works with default macOS terminal settings.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes in five-cell steps. -r keeps the bindings repeatable after one
# prefix press.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Vim-style copy mode.
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Prefer the native host clipboard when an available copy tool is present.
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell -b 'command -v wl-copy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell -b 'command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Clear the visible screen and tmux's scrollback together.
# Bind your terminal's Cmd-K (or similar) to send "C-a C-l" to invoke this.
bind-key C-l send-keys C-l \; clear-history \; display-message "Cleared screen and history"

# Fast reload while iterating on this config.
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
